<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Travel assistant</h1>
            <p class="subtitle">Practical help with routes, traffic, and planning your journeys</p>
        </header>

        <div class="main-layout">
            <div class="chat-column">
                <div class="chat-container">
                    <div class="chat-messages" id="chatMessages">
                        <div class="message bot-message">
                            <div class="message-content">
                                <p>Hi, I'm your travel assistant. I can help you with:</p>
                                <ul style="margin-left: 20px; margin-top: 8px;">
                                    <li>Journey planning and routes</li>
                                    <li>Transport timetables</li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="journey-planner-toggle-wrap">
                        <button
                            type="button"
                            id="journey-planner-toggle"
                            class="journey-planner-toggle-btn hidden"
                            aria-expanded="false"
                            aria-controls="journey-inputs"
                        >
                            Show journey planner
                        </button>
                    </div>

                    <section
                        id="journey-inputs"
                        class="journey-inputs hidden"
                        aria-label="Plan a journey"
                    >
                        <div class="journey-field">
                            <label for="from-input">From</label>
                            <input
                                id="from-input"
                                type="text"
                                placeholder="Start location"
                                autocomplete="off"
                            />
                        </div>

                        <div class="journey-field">
                            <label for="to-input">To</label>
                            <input
                                id="to-input"
                                type="text"
                                placeholder="Destination"
                                autocomplete="off"
                            />
                        </div>

                        <div class="journey-field journey-when">
                            <label for="date-input">When</label>
                            <div class="journey-when-row">
                                <input
                                    id="date-input"
                                    type="date"
                                    aria-label="Travel date"
                                />
                                <input
                                    id="time-input"
                                    type="time"
                                    aria-label="Travel time"
                                />
                            </div>
                            <small class="journey-when-hint">Optional: date and time</small>
                        </div>

                        <div class="journey-actions">
                            <button id="plan-btn" type="button">Plan</button>
                        </div>
                    </section>

                    <div class="chat-input-container">
                        <input
                            type="text"
                            id="userInput"
                            placeholder="Ask about traffic, delays, routes..."
                            autocomplete="off"
                        >
                        <button id="sendButton">Send</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel" aria-label="Detected intent and entities">
                <div class="info-panel">
                    <div class="info-item">
                        <strong>Detected Intent:</strong> <span id="intentDisplay">-</span>
                    </div>
                    <div class="info-item">
                        <strong>Confidence:</strong> <span id="confidenceDisplay">-</span>
                    </div>
                    <div class="info-item">
                        <strong>Entities:</strong> <span id="entitiesDisplay">-</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
