<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Travel assistant</h1>
            <p class="subtitle">Ask about traffic, routes, timetables, and travel conditions</p>
        </header>

        <div class="main-layout">
            <div class="chat-column">
                <div class="chat-container">
                    <div class="chat-messages" id="chatMessages">
                        <div class="message bot-message">
                            <p>Hi, I'm your travel assistant. I can help you with:</p>
                            <ul>
                                <li>Delay information</li>
                                <li>Transit disruptions</li>
                                <li>Timetables and schedules</li>
                                <li>Route suggestions</li>
                            </ul>
                        </div>
                    </div>
                    <div class="chat-input-container">
                        <input
                            type="text"
                            id="userInput"
                            placeholder="Ask about traffic, delays, routes, or timetables..."
                            autocomplete="off"
                        >
                        <button id="sendButton">Send</button>
                    </div>
                </div>
            </div>

            <aside class="side-panel">
                <div class="info-panel">
                    <div class="info-item">
                        <strong>Detected Intent:</strong> <span id="intentDisplay">-</span>
                    </div>
                    <div class="info-item">
                        <strong>Confidence:</strong> <span id="confidenceDisplay">-</span>
                    </div>
                    <div class="info-item">
                        <strong>Entities:</strong> <span id="entitiesDisplay">-</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
